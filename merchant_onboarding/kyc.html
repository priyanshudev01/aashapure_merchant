<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYC Upload</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="../shared/app.css" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface">
<div class="flex min-h-screen">
<div class="w-1/3 bg-green-700 text-white p-10">
<h1 class="text-5xl font-bold leading-tight">Complete Your KYC</h1>
<p class="mt-6 text-lg">Upload identity and business verification documents.</p>
<div class="mt-10 rounded-2xl bg-white/10 p-5">
<p class="text-sm font-semibold" data-merchant-name>Merchant Name</p>
<p class="mt-2 text-xs uppercase tracking-[0.2em] text-white/80">Step 02 of 03</p>
<div class="mt-4 app-status-badge" data-kyc-status data-status="not_started">KYC Pending</div>
</div>
</div>
<div class="w-2/3 p-12">
<div class="flex items-start justify-between gap-6">
<div>
<p class="text-sm font-bold text-green-700">STEP 02 OF 03</p>
<h1 class="mt-2 text-4xl font-bold">KYC &amp; Documents</h1>
<p class="mt-2 text-sm text-slate-600">Upload verified merchant documents for review.</p>
</div>
<div class="rounded-2xl border border-slate-200 bg-white px-5 py-4 text-right shadow-sm">
<p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Merchant</p>
<p class="mt-2 text-base font-semibold text-slate-900" data-user-name>Aman</p>
<p class="text-sm text-slate-500" data-merchant-name>Asha Pure Merchant</p>
</div>
</div>

<div id="kycStatusCard" class="mt-8 hidden rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
<div class="app-status-badge" data-kyc-status data-status="under_review">KYC Under Review</div>
<h2 id="kycStatusTitle" class="mt-4 text-2xl font-bold text-slate-900"></h2>
<p id="kycStatusCopy" class="mt-2 text-sm text-slate-600"></p>
<a class="mt-6 inline-flex rounded-xl bg-green-700 px-6 py-3 text-sm font-semibold text-white" href="settlement.html">Continue to Settlement</a>
</div>

<form id="kycForm" class="mt-8">
<div class="grid grid-cols-2 gap-6">
<input id="aadhaar" type="text" placeholder="Aadhaar Number" class="rounded-lg border p-4">
<input id="pan" type="text" placeholder="PAN Number" class="rounded-lg border p-4">
<input id="gst" type="text" placeholder="GST Number" class="rounded-lg border p-4">
<input id="license" type="text" placeholder="Business License Number" class="rounded-lg border p-4">
<div>
<label class="mb-2 block font-semibold">Upload Aadhaar Card</label>
<input id="aadhaarFile" type="file" class="w-full rounded-lg border bg-white p-4">
</div>
<div>
<label class="mb-2 block font-semibold">Upload PAN Card</label>
<input id="panFile" type="file" class="w-full rounded-lg border bg-white p-4">
</div>
</div>
<button id="saveNext" class="mt-10 rounded-lg bg-green-700 px-8 py-4 text-white hover:bg-green-800" type="submit">Save &amp; Next</button>
</form>
</div>
</div>
<script src="../shared/app.js"></script>
<script>
const kycForm = document.getElementById("kycForm");
const kycStatusCard = document.getElementById("kycStatusCard");
const kycStatusTitle = document.getElementById("kycStatusTitle");
const kycStatusCopy = document.getElementById("kycStatusCopy");

function showStatusCard(status) {
  kycForm.classList.add("hidden");
  kycStatusCard.classList.remove("hidden");

  if (status === "verified") {
    kycStatusTitle.textContent = "KYC Verified";
    kycStatusCopy.textContent = "Your documents are already verified. You do not need to upload them again.";
  } else {
    kycStatusTitle.textContent = "KYC Under Review";
    kycStatusCopy.textContent = "Your documents have already been submitted and are being reviewed by the operations team.";
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  const { merchant, kyc } = await AppShell.bootstrap();

  if (!merchant?.merchantId) {
    window.location.href = "code.html";
    return;
  }

  if (kyc?.status === "verified" || kyc?.status === "under_review") {
    showStatusCard(kyc.status);
  }
});

kycForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const merchant = AppShell.getStoredMerchantProfile();
  if (!merchant?.merchantId) {
    alert("Please complete merchant onboarding first.");
    window.location.href = "code.html";
    return;
  }

  const data = {
    merchantId: merchant.merchantId,
    aadhaar: document.getElementById("aadhaar").value.trim(),
    pan: document.getElementById("pan").value.trim().toUpperCase(),
    gst: document.getElementById("gst").value.trim(),
    license: document.getElementById("license").value.trim(),
    aadhaarFile: document.getElementById("aadhaarFile").value,
    panFile: document.getElementById("panFile").value
  };

  if (!data.aadhaar || !data.pan || !data.gst || !data.license) {
    alert("Please fill all fields");
    return;
  }

  if (!/^[0-9]{12}$/.test(data.aadhaar)) {
    alert("Aadhaar must be 12 digits");
    return;
  }

  if (!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(data.pan)) {
    alert("Enter valid PAN Number");
    return;
  }

  if (!data.aadhaarFile || !data.panFile) {
    alert("Please upload Aadhaar and PAN files");
    return;
  }

  const res = await fetch(`${AppShell.API_BASE}/kyc`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  if (!res.ok) {
    alert(result.message || "Unable to save KYC");
    return;
  }

  alert(result.message);
  window.location.href = "settlement.html";
});
</script>
</body>
</html>
