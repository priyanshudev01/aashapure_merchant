<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add/Edit Product - Asha Pure Merchant</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="../shared/app.css" rel="stylesheet"/>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: "#206223",
        "primary-container": "#3a7b3a",
        surface: "#f9f9f9",
        "surface-container": "#eeeeee",
        "surface-container-low": "#f3f3f3",
        "surface-container-highest": "#e2e2e2",
        "surface-container-lowest": "#ffffff",
        tertiary: "#923357"
      },
      fontFamily: {
        headline: ["Manrope"],
        body: ["Inter"]
      }
    }
  }
};
</script>
</head>
<body class="bg-surface font-body text-slate-900">
<aside class="fixed left-0 top-0 flex h-full w-64 flex-col overflow-y-auto bg-[#f9f9f9] shadow-[24px_0_40px_rgba(26,28,28,0.06)]">
  <div class="p-8">
    <span class="font-headline text-2xl font-black text-primary">Asha Pure Merchant</span>
    <div class="mt-2 text-xs uppercase tracking-widest text-slate-500" data-merchant-name>Merchant Name</div>
  </div>
  <nav class="flex-1 px-4 space-y-1">
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../merchant_dashboard/code.html"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
    <a class="flex items-center gap-3 rounded-r-full bg-stone-200 px-4 py-3 text-sm font-bold text-primary" href="../inventory_management/code.html"><span class="material-symbols-outlined">inventory_2</span>Inventory</a>
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../orders_management/code.html"><span class="material-symbols-outlined">shopping_cart</span>Orders</a>
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../earnings_payouts/code.html"><span class="material-symbols-outlined">payments</span>Earnings</a>
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../approval_status/code.html"><span class="material-symbols-outlined">verified_user</span>KYC Documents</a>
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../settings/code.html"><span class="material-symbols-outlined">settings</span>Settings</a>
  </nav>
</aside>

<header class="fixed left-64 right-0 top-0 z-30 flex items-center justify-between bg-[#f9f9f9]/90 px-8 py-4 backdrop-blur-xl">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-slate-500">Inventory</p>
    <h1 class="font-headline text-2xl font-extrabold">List Dairy Product</h1>
  </div>
  <div class="text-right">
    <div class="text-sm font-bold text-primary" data-user-name>Merchant Name</div>
    <div class="app-status-badge" data-kyc-status data-status="not_started">KYC Pending</div>
  </div>
</header>

<main class="ml-64 mt-24 grid grid-cols-1 gap-10 p-10 lg:grid-cols-3">
  <section class="lg:col-span-2 rounded-[2rem] bg-surface-container-low p-8">
    <form class="space-y-8" id="productForm">
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        <div class="md:col-span-2">
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Product Type</label>
          <select id="productType" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" required>
            <option value="">Select Product Type</option>
            <option value="Cow Milk">Cow Milk</option>
            <option value="Buffalo Milk">Buffalo Milk</option>
            <option value="Normal Milk">Normal Milk</option>
            <option value="Mixed Milk">Mixed Milk</option>
            <option value="Paneer">Paneer</option>
            <option value="Curd">Curd</option>
            <option value="Ghee">Ghee</option>
          </select>
        </div>
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Price Unit</label>
          <select id="priceUnit" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" required>
            <option value="">Select Unit</option>
            <option value="Per Litre">Per Litre</option>
            <option value="Per Kilogram">Per Kilogram</option>
            <option value="Per Unit">Per Unit</option>
          </select>
        </div>
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Fat Percentage</label>
          <input id="fatPercentage" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" type="number" min="1" max="15" step="0.1" value="6.5" required>
        </div>
        <div class="md:col-span-2">
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Description</label>
          <textarea id="description" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" rows="4" required></textarea>
        </div>
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Price</label>
          <input id="price" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" type="number" min="1" value="80" required>
        </div>
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Available Quantity</label>
          <input id="quantity" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" type="number" min="0" value="250" required>
        </div>
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Number of Cows</label>
          <input id="cows" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" type="number" min="0" value="0" required>
        </div>
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Number of Buffaloes</label>
          <input id="buffaloes" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" type="number" min="0" value="0" required>
        </div>
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Supply Time</label>
          <select id="supplyTime" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" required>
            <option value="">Select Supply Time</option>
            <option value="Morning">Morning</option>
            <option value="Evening">Evening</option>
            <option value="Both">Both</option>
          </select>
        </div>
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500">Delivery Radius</label>
          <input id="deliveryRadius" class="w-full rounded-xl border-0 bg-surface-container-highest px-4 py-3" type="number" min="1" value="15" required>
        </div>
      </div>
      <div class="flex justify-end gap-4">
        <button class="rounded-xl bg-surface-container px-8 py-3 font-semibold text-slate-600" type="reset">Cancel</button>
        <button class="rounded-xl bg-gradient-to-br from-primary to-primary-container px-10 py-3 font-bold text-white" type="submit">List Product</button>
      </div>
    </form>
  </section>

  <aside class="space-y-6">
    <div class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white p-6 shadow-sm">
      <div class="aspect-square overflow-hidden rounded-2xl bg-slate-100">
        <img id="productPreviewImage" alt="Dairy Product Preview" class="h-full w-full object-cover" src="https://images.unsplash.com/photo-1628088062854-d1870b4553da?auto=format&amp;fit=crop&amp;w=900&amp;q=80">
      </div>
      <div class="mt-6 space-y-4">
        <div class="flex items-start justify-between gap-3">
          <span id="previewBadge" class="rounded-full bg-primary/10 px-3 py-1 text-[10px] font-bold uppercase tracking-widest text-primary">Product</span>
          <span id="previewPrice" class="text-sm font-bold text-tertiary">Rs 0</span>
        </div>
        <h2 id="previewTitle" class="font-headline text-2xl font-extrabold">Dairy Product Preview</h2>
        <p id="previewQuantity" class="text-sm text-slate-500">Available: 0 units</p>
      </div>
    </div>
  </aside>
</main>

<script src="../shared/app.js"></script>
<script>
const previewFields = {
  image: document.getElementById("productPreviewImage"),
  badge: document.getElementById("previewBadge"),
  price: document.getElementById("previewPrice"),
  title: document.getElementById("previewTitle"),
  quantity: document.getElementById("previewQuantity")
};

function updatePreview() {
  const productType = document.getElementById("productType").value || "Product";
  const price = document.getElementById("price").value || "0";
  const priceUnit = document.getElementById("priceUnit").value || "Unit";
  const quantity = document.getElementById("quantity").value || "0";

  previewFields.image.src = AppShell.getProductImage(productType);
  previewFields.badge.textContent = productType;
  previewFields.price.textContent = `Rs ${price} / ${priceUnit}`;
  previewFields.title.textContent = productType === "Product" ? "Dairy Product Preview" : productType;
  previewFields.quantity.textContent = `Available: ${quantity} units`;
}

["productType", "price", "priceUnit", "quantity"].forEach((fieldId) => {
  const field = document.getElementById(fieldId);
  field.addEventListener("input", updatePreview);
  field.addEventListener("change", updatePreview);
});

document.addEventListener("DOMContentLoaded", async () => {
  await AppShell.bootstrap();
  updatePreview();
});

document.getElementById("productForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const merchant = AppShell.getStoredMerchantProfile();
  if (!merchant?.merchantId) {
    alert("Please complete merchant onboarding first");
    window.location.href = "../merchant_onboarding/code.html";
    return;
  }

  const productType = document.getElementById("productType").value;
  const priceUnit = document.getElementById("priceUnit").value;
  const fatPercentage = parseFloat(document.getElementById("fatPercentage").value);
  const description = document.getElementById("description").value;
  const price = parseFloat(document.getElementById("price").value);
  const quantity = parseFloat(document.getElementById("quantity").value);
  const cows = parseInt(document.getElementById("cows").value, 10);
  const buffaloes = parseInt(document.getElementById("buffaloes").value, 10);
  const supplyTime = document.getElementById("supplyTime").value;
  const deliveryRadius = parseInt(document.getElementById("deliveryRadius").value, 10);

  if (!productType || !priceUnit || !description || !supplyTime) {
    alert("Please fill all required fields");
    return;
  }

  const response = await fetch(`${AppShell.API_BASE}/products`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      merchantId: merchant.merchantId,
      productType,
      priceUnit,
      fatPercentage,
      description,
      price,
      quantity,
      cows,
      buffaloes,
      supplyTime,
      deliveryRadius,
      imageUrl: AppShell.getProductImage(productType)
    })
  });

  const result = await response.json();
  if (!response.ok) {
    alert(result.message || "Unable to save product");
    return;
  }

  alert(result.message);
  window.location.href = "../inventory_management/code.html";
});
</script>
</body>
</html>
