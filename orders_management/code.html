<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Orders Management | Asha Pure Merchant</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="../shared/app.css" rel="stylesheet"/>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: "#206223",
        "primary-container": "#3a7b3a",
        surface: "#f9f9f9",
        "surface-container": "#eeeeee",
        "surface-container-low": "#f3f3f3",
        "surface-container-lowest": "#ffffff",
        "error-container": "#ffdad6",
        tertiary: "#923357"
      },
      fontFamily: {
        headline: ["Manrope"],
        body: ["Inter"]
      }
    }
  }
};
</script>
</head>
<body class="bg-surface font-body text-slate-900">
<aside class="fixed left-0 top-0 flex h-full w-64 flex-col overflow-y-auto bg-[#f9f9f9] shadow-[24px_0_40px_rgba(26,28,28,0.06)]">
  <div class="p-8">
    <div class="font-headline text-2xl font-black text-primary">Asha Pure Merchant</div>
    <div class="mt-1 text-xs uppercase tracking-[0.2em] text-slate-500" data-merchant-name>Merchant Name</div>
  </div>
  <nav class="flex-1 px-4 space-y-1">
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../merchant_dashboard/code.html"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../inventory_management/code.html"><span class="material-symbols-outlined">inventory_2</span>Inventory</a>
    <a class="flex items-center gap-3 rounded-r-full bg-stone-200 px-4 py-3 text-sm font-bold text-primary" href="../orders_management/code.html"><span class="material-symbols-outlined">shopping_cart</span>Orders</a>
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../earnings_payouts/code.html"><span class="material-symbols-outlined">payments</span>Earnings</a>
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../approval_status/code.html"><span class="material-symbols-outlined">verified_user</span>KYC Documents</a>
    <a class="flex items-center gap-3 rounded-r-full px-4 py-3 text-sm font-medium text-slate-600" href="../settings/code.html"><span class="material-symbols-outlined">settings</span>Settings</a>
  </nav>
</aside>

<header class="fixed left-64 right-0 top-0 z-30 flex items-center justify-between bg-[#f9f9f9]/90 px-8 py-4 backdrop-blur-xl">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-slate-500">Orders</p>
    <h1 class="font-headline text-2xl font-extrabold">Orders Management</h1>
  </div>
  <div class="text-right">
    <div class="text-sm font-bold text-primary" data-user-name>Merchant Name</div>
    <div class="app-status-badge" data-kyc-status data-status="not_started">KYC Pending</div>
  </div>
</header>

<main class="ml-64 mt-24 p-8">
  <div class="mb-8 flex flex-wrap items-center justify-between gap-4 rounded-2xl bg-surface-container-low p-4">
    <div class="flex flex-wrap gap-2">
      <button class="filter-btn rounded-full bg-primary px-5 py-2 text-sm font-bold text-white" data-filter="all">All Orders</button>
      <button class="filter-btn rounded-full bg-white px-5 py-2 text-sm font-medium text-slate-600" data-filter="Pending">Pending</button>
      <button class="filter-btn rounded-full bg-white px-5 py-2 text-sm font-medium text-slate-600" data-filter="Delivered">Delivered</button>
      <button class="filter-btn rounded-full bg-white px-5 py-2 text-sm font-medium text-slate-600" data-filter="Cancelled">Cancelled</button>
    </div>
    <input id="orderSearch" class="w-full max-w-sm rounded-xl border-0 bg-white px-4 py-3 text-sm" placeholder="Search orders, customers, or product names" type="text">
  </div>

  <section id="ordersSummary" class="mb-8 grid grid-cols-1 gap-4 md:grid-cols-4"></section>
  <section id="ordersContainer" class="space-y-4"></section>
</main>

<script src="../shared/app.js"></script>
<script>
let allOrders = [];
let activeFilter = "all";

function getStatusClasses(status) {
  if (status === "Rejected" || status === "Cancelled") return "bg-error-container text-red-700";
  if (status === "Pending") return "bg-amber-100 text-amber-800";
  if (status === "Accepted") return "bg-sky-100 text-sky-700";
  return "bg-green-100 text-green-700";
}

function renderSummary(orders) {
  const summary = [
    { label: "Total Orders", value: orders.length },
    { label: "Pending", value: orders.filter((order) => order.status === "Pending").length },
    { label: "Delivered", value: orders.filter((order) => order.status === "Delivered" || order.status === "Completed").length },
    { label: "Cancelled", value: orders.filter((order) => order.status === "Cancelled" || order.status === "Rejected").length }
  ];

  document.getElementById("ordersSummary").innerHTML = summary.map((item) => `
    <div class="rounded-2xl bg-white p-6 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-500">${item.label}</p>
      <p class="mt-3 font-headline text-3xl font-extrabold">${item.value}</p>
    </div>
  `).join("");
}

function getFilteredOrders() {
  const search = document.getElementById("orderSearch").value.trim().toLowerCase();

  return allOrders.filter((order) => {
    const matchesFilter = activeFilter === "all" || order.status === activeFilter;
    const haystack = `${order.orderId} ${order.customerName} ${order.product}`.toLowerCase();
    const matchesSearch = !search || haystack.includes(search);
    return matchesFilter && matchesSearch;
  });
}

function renderOrders() {
  const orders = getFilteredOrders();
  const container = document.getElementById("ordersContainer");

  if (!orders.length) {
    container.innerHTML = AppShell.buildEmptyState("No orders yet", "Start by placing your first order or wait for your first customer order to arrive.", "receipt_long");
    return;
  }

  container.innerHTML = orders.map((order) => `
    <article class="rounded-2xl bg-white p-6 shadow-sm">
      <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
        <div class="grid flex-1 grid-cols-1 gap-6 md:grid-cols-3">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">Customer</p>
            <h2 class="mt-2 text-lg font-bold">${order.customerName}</h2>
            <p class="mt-1 text-xs text-slate-500">${order.product}</p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">Order Details</p>
            <p class="mt-2 text-sm font-semibold">${order.orderId}</p>
            <p class="mt-1 text-xs text-slate-500">${AppShell.formatDate(order.date)} • Qty ${order.qty}</p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">Amount</p>
            <p class="mt-2 font-headline text-2xl font-extrabold">${AppShell.formatCurrency(order.amount)}</p>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <span class="rounded-full px-3 py-1 text-[10px] font-bold uppercase tracking-wider ${getStatusClasses(order.status)}">${order.status}</span>
          ${order.status === "Pending" ? `<button class="rounded-xl bg-primary px-5 py-2 text-sm font-bold text-white" data-order-action="Delivered" data-order-id="${order._id}">Mark Delivered</button>` : ""}
          ${order.status === "Pending" ? `<button class="rounded-xl bg-error-container px-5 py-2 text-sm font-bold text-red-700" data-order-action="Cancelled" data-order-id="${order._id}">Cancel Order</button>` : ""}
        </div>
      </div>
    </article>
  `).join("");

  container.querySelectorAll("[data-order-action]").forEach((button) => {
    button.addEventListener("click", async () => {
      const response = await fetch(`${AppShell.API_BASE}/orders/${button.dataset.orderId}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ status: button.dataset.orderAction })
      });
      const result = await response.json();
      if (!response.ok) {
        alert(result.message || "Unable to update order");
        return;
      }
      await loadOrders();
    });
  });
}

async function loadOrders() {
  const merchant = AppShell.getStoredMerchantProfile();
  if (!merchant?.merchantId) {
    document.getElementById("ordersContainer").innerHTML = AppShell.buildEmptyState("Merchant account missing", "Complete onboarding to view and manage orders.", "storefront");
    return;
  }

  allOrders = await AppShell.fetchJson(`/orders?merchantId=${merchant.merchantId}`).catch(() => []);
  renderSummary(allOrders);
  renderOrders();
}

document.addEventListener("DOMContentLoaded", async () => {
  await AppShell.bootstrap();
  await loadOrders();

  document.querySelectorAll(".filter-btn").forEach((button) => {
    button.addEventListener("click", () => {
      activeFilter = button.dataset.filter;
      document.querySelectorAll(".filter-btn").forEach((node) => {
        node.className = "filter-btn rounded-full bg-white px-5 py-2 text-sm font-medium text-slate-600";
      });
      button.className = "filter-btn rounded-full bg-primary px-5 py-2 text-sm font-bold text-white";
      renderOrders();
    });
  });

  document.getElementById("orderSearch").addEventListener("input", renderOrders);
});
</script>
</body>
</html>
